name: Build, Push, Scan and Deploy Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: iit-project
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # =========================================================================
  # 1. SonarQube SAST Code Analysis & Quality Gate Check
  # =========================================================================
  sonarqube-analysis:
    name: SonarQube Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Enforce SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # =========================================================================
  # 2. Build & Push Docker Image
  # =========================================================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sonarqube-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short Git Commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  # =========================================================================
  # 3. Trivy Security Scan & Live Web Dashboard Deploy
  # =========================================================================
  trivy-scan:
    name: Scan Docker Image with Trivy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short Git Commit SHA
        id: commit
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Fetch HTML Template
        run: |
          wget -q https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -O html.tpl

      - name: Generate HTML Vulnerability Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'template'
          template: '@html.tpl'
          output: 'index.html'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Generate Table Report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Publish Trivy Summary to GitHub Actions
        if: always()
        run: |
          echo "### 🛡️ Trivy Container Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Scanned Image:** \`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.commit.outputs.sha }}\`" >> \$GITHUB_STEP_SUMMARY
          echo '```text' >> \$GITHUB_STEP_SUMMARY
          cat trivy-results.txt >> \$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Deploy Live Trivy Dashboard to VM
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: '4.193.169.35'
          username: 'IIT'
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'index.html'
          target: '/var/www/trivy-reports/'
          strip_components: 0

  # =========================================================================
  # 4. Instant GitOps Update (ArgoCD Auto-Sync)
  # =========================================================================
  update-gitops:
    name: Update GitOps Repository
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Checkout GitOps Repo
        uses: actions/checkout@v4
        with:
          repository: 'AbdullahMahiBD/iit-workshop-gitops'
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      - name: Update Image Tag in deployment.yml
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s|(image:\s*${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}):.*|\1:${SHORT_SHA}|g" gitops-repo/frontend/deployment.yml

      - name: Commit and Push to GitOps Repo
        run: |
          cd gitops-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/deployment.yml
          if git diff --staged --quiet; then
            echo "No changes in deployment.yml"
          else
            git commit -m "chore: auto-deploy commit ${GITHUB_SHA::7}"
            git push origin main
          fi

  # =========================================================================
  # 5A. Pipeline SUCCESS Notifier (Triggers when ALL jobs pass)
  # =========================================================================
  notify-success:
    name: Send Success Email Alert
    runs-on: ubuntu-latest
    needs: [sonarqube-analysis, build-and-push, trivy-scan, update-gitops]
    if: success()
    steps:
      - name: Dispatch Success Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.office365.com' }}
          server_port: ${{ secrets.MAIL_PORT || 587 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [SUCCESS] DevSecOps Pipeline Passed - Web Application Published"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "IIT DevSecOps Automation <${{ secrets.MAIL_USERNAME }}>"
          secure: false
          body: |
            =======================================================
            ✅ CI/CD PIPELINE & DEPLOYMENT SUCCESSFUL
            =======================================================
            
            Repository:    ${{ github.repository }}
            Branch:        ${{ github.ref_name }}
            Commit SHA:    ${{ github.sha }}
            Triggered By:  ${{ github.actor }}
            
            Quality Gate Result: PASSED (Sonar way Gate Active)
            Deployment Status:  Published to ArgoCD GitOps
            
            Live Portal: https://project.iitju.tech
            Trivy Security Report: https://trivy.iitju.tech
            
            -------------------------------------------------------
            IIT-JU DevSecOps Automated Monitoring System

  # =========================================================================
  # 5B. Pipeline FAILURE Notifier (Triggers on Quality Gate or Build Fail)
  # =========================================================================
  notify-failure:
    name: Send Failure Email Alert
    runs-on: ubuntu-latest
    needs: [sonarqube-analysis, build-and-push, trivy-scan, update-gitops]
    if: failure()
    steps:
      - name: Dispatch Failure Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.office365.com' }}
          server_port: ${{ secrets.MAIL_PORT || 587 }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🚨 [FAILED] DevSecOps Pipeline Blocked - Quality Gate Violation"
          to: ${{ secrets.MAIL_RECIPIENT }}
          from: "IIT DevSecOps Automation <${{ secrets.MAIL_USERNAME }}>"
          secure: false
          body: |
            =======================================================
            🚨 CI/CD PIPELINE EXECUTION FAILED
            =======================================================
            
            Repository:    ${{ github.repository }}
            Branch:        ${{ github.ref_name }}
            Commit SHA:    ${{ github.sha }}
            Triggered By:  ${{ github.actor }}
            
            Failure Summary:
            The build and deployment process was blocked. 
            
            Potential Pipeline Issues To Fix:
            1. SonarQube Quality Gate Failed (IIT-JU Strict Gate active: Coverage < 100%, Duplications, or Security Hotspots).
            2. Build compilation or Docker image assembly failed.
            3. GitOps repository synchronization failure.
            
            Required Action:
            - Review SonarQube Dashboard: https://sonar.iitju.tech
            - Review GitHub Action Workflow Logs:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            -------------------------------------------------------
            IIT-JU DevSecOps Automated Monitoring System